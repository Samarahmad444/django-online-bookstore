{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookShop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'BookShop/styles.css' %}" rel="stylesheet">
</head>

<body class="bg-light"> 
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"> 
<div class="container">
<span class="navbar-brand fw-bold">BookShop</span>
{% if request.resolver_match.url_name != 'login' and request.resolver_match.url_name != 'registeration' %}
<ul class="navbar-nav flex-row ms-auto">
<li class="nav-item"><a class="nav-link" href="{% url 'BookShop:products' %}">Products</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'BookShop:basket' %}">Basket</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'BookShop:order' %}">Order</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'BookShop:logout' %}">Logout</a></li>
</ul>
{% endif %}
</div>
</nav>

<div class="container my-4 main-container">
<div class="card p-4">
{% block body %}{% endblock %}
</div>
</div>
</body>
</html>
