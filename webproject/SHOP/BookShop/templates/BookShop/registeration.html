{% extends "BookShop/layout.html" %}
{% load static %}
{% block body %}
<img src="{% static 'BookShop/logo.jpg' %}" class="logo-center" alt="BookShop Logo" width="200">
<h2>Create Account</h2>
  
{% if message %}
<div style="color: red; margin: 10px 0;">{{ message }}</div>
{% endif %}

<form action="{% url 'BookShop:registeration' %}" method="post">
{% csrf_token %}
<input type="text" class="input" name="username" placeholder="Username" required>
<input type="email" class="input" name="email" placeholder="Email" required>
<input type="password" class="input" name="password" placeholder="Password" required>
<button type="submit" class="button">Register</button>
</form>
<a href="{% url 'BookShop:login' %}" class="link">Back to login page</a>

{% endblock %}
